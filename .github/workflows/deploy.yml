# Builds the web app and publishes it to GitHub Pages on every push to main.
# The idle-tycoon exploration (branch idle-tycoon) is built too and published beside
# the app at /<repo>/idle/; after pushing that branch, run this workflow by hand.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build the idle-tycoon exploration into /idle/
        run: |
          if git ls-remote --exit-code --heads origin idle-tycoon > /dev/null; then
            git fetch --depth 1 origin idle-tycoon
            git worktree add ../idle FETCH_HEAD
            cd ../idle/app
            npm ci
            BASE_PATH=/${{ github.event.repository.name }}/idle/ npm run build
            cp -r dist "$GITHUB_WORKSPACE/app/dist/idle"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
