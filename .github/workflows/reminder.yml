# Gauchito's daily notifications, Madrid time: buen día 9:00, reminder 16:00,
# buenas noches 21:00. Each time has two crons, for summer (UTC+2) and winter
# (UTC+1) time; they fire at :50 UTC, before the busy top of the hour, and the
# script waits for the full hour. The cron that doesn't land on a slot exits.
name: Daily notifications

on:
  schedule:
    - cron: '50 6 * * *' # 9:00 summer
    - cron: '50 7 * * *' # 9:00 winter
    - cron: '50 13 * * *' # 16:00 summer
    - cron: '50 14 * * *' # 16:00 winter
    - cron: '50 18 * * *' # 21:00 summer
    - cron: '50 19 * * *' # 21:00 winter
  workflow_dispatch:
    inputs:
      kind:
        description: Which notification to send now
        type: choice
        options: [reminder, morning, night]
        default: reminder

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node send-reminder.mjs
        working-directory: scripts
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ inputs.kind }}
